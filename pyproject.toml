[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "payroll-gate"
version = "1.4.0"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35,<2","jsonschema[format]>=4.20,<5"]
[project.optional-dependencies]
dev = ["ruff==0.15.9","mypy==1.18.2","pytest==9.2.0"]
[tool.setuptools.package-data]
payroll_gate = ["schemas/*.json"]
[tool.mypy]
strict = true
[[tool.mypy.overrides]]
module = ["boto3","botocore.*","jsonschema"]
ignore_missing_imports = true
[tool.pytest.ini_options]
pythonpath=["src"]
